# Builds mcmetal on GitHub's Apple Silicon macOS runners and checks what can be checked without a real GPU:
# the dylibs compile, every MSL program our smoke test produces compiles with Apple's offline Metal compiler,
# and the headless smoke test runs (its pixel checks only count if the runner reports a real Metal device).
name: mac
on:
  push:
    paths-ignore:  # notes and gallery pictures only: nothing to build or run
      - '**.md'
      - 'shaderpack/screens/**'
  workflow_dispatch:
    inputs:
      phases:
        description: 'game phases, one Mac each (title world complementary water ...); a&b runs a then b on one Mac'
        default: title&world complementary
      env:
        description: extra env for every phase, e.g. MGL_DEBUG_DRAWS=1
        default: ''
      long:
        description: 'soak test: play each phase for its full time instead of stopping after 4 screenshots in the world'
        type: boolean
        default: false
      bench:
        description: 'frame-rate run (GAME_BENCH): 1920x1200, no vsync, 10 s settle then 30 s of fps samples; see fps.txt'
        type: boolean
        default: false
      settle:
        description: 'bench: seconds to wait after joining before measuring (heavy packs keep compiling for 30 s or more)'
        default: '10'
      ab_off:
        description: 'ab-* phases: env of the "old" run, e.g. MGL_TEX_COMPRESS=0'
        default: ''
      look:
        description: 'camera, as tp rotation "yaw pitch" each tick (e.g. "~2 7" turns 2 degrees a tick); empty = scene default'
        default: ''
      profile:
        description: 'bench: also profile every GL call (glprof: calls, CPU time per frame) and the Java side (JFR); see glprof-report.txt, jfr-report.txt'
        type: boolean
        default: false
      segments:
        description: 'bench: more scenes in the same launch after each phase, a file in tests/game/segments/ (e.g. times)'
        default: ''
      jvm:
        description: 'JVM options for the game, e.g. "-XX:+UseZGC -XX:+ZGenerational" (bench: JVM pauses in gc-report.txt)'
        default: ''
# A newer push to the same branch cancels the older push's run (it tests the same work plus more). Manual runs
# (bench, profile, ab-*) each get their own group and are never cancelled.
concurrency:
  group: mac-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read  # Pick game phases looks up earlier runs
defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing build isn't hidden by `| tee`
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      phases: ${{ steps.plan.outputs.phases }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache glslang + SPIRV-Cross
        uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ hashFiles('build_deps.sh') }}
      - name: Build
        run: bash build_mac.sh 2>&1 | tee build.log
      - name: Smoke test
        run: |
          mkdir -p msl
          MGL_LOG=$PWD/smoke-mgl.log MGL_MSL_DUMP=$PWD/msl ./build/gl_smoke | tee smoke.txt
          cat smoke-mgl.log || true
      - name: Smoke test, untracked GS records (MGL_GS_UNTRACKED=1)
        run: |
          MGL_LOG=$PWD/smoke-ut-mgl.log MGL_GS_UNTRACKED=1 ./build/gl_smoke | tee smoke-ut.txt
          cat smoke-ut-mgl.log || true
      - name: Smoke test, smoothness options on
        run: |
          mkdir -p cache
          MGL_LOG=$PWD/smoke2-mgl.log MGL_CACHE_DIR=$PWD/cache MGL_BINARY_ARCHIVE=1 MGL_ASYNC_PIPELINES=1 MGL_FRAME_PACING=1 \
            ./build/gl_smoke | tee smoke2.txt || true
          MGL_LOG=$PWD/smoke3-mgl.log MGL_CACHE_DIR=$PWD/cache MGL_BINARY_ARCHIVE=1 ./build/gl_smoke | tee smoke3.txt || true
          cat smoke2-mgl.log smoke3-mgl.log || true
          ls -la cache || true
      - name: Compile check with the newest Xcode (macOS 26 SDK parts, e.g. frame interpolation)
        continue-on-error: true
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "no Xcode 26 on this runner"; exit 0; fi
          echo "using $X"
          grep -h "@property" $X/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/MetalFX.framework/Headers/MTLFXFrameInterpolator.h || true
          DEVELOPER_DIR=$X/Contents/Developer xcrun clang -arch arm64 -fsyntax-only -Wall -Wno-unused-parameter \
            -mmacosx-version-min=14.0 -fobjc-arc -Icore -Ibuild/deps/include mac/mgl_metal.m
      - name: Offline MSL compile
        run: |
          xcrun -f metal || xcodebuild -downloadComponent MetalToolchain || true
          fail=0
          for f in msl/*.metal; do
            xcrun metal -std=metal3.1 -c "$f" -o /tmp/out.air 2>err.txt || { fail=$((fail+1)); echo "== $f"; cat err.txt; }
          done
          echo "offline MSL compile failures: $fail of $(ls msl/*.metal | wc -l)"
          test $fail -eq 0
      - name: Device info
        if: always()
        run: system_profiler SPDisplaysDataType || true
      - name: Pick game phases
        id: plan
        env:
          PHASES: ${{ github.event.inputs.phases }}
          EVENT: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TREE: ${{ github.event.head_commit.tree_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          phases="$PHASES"
          [ -n "$phases" ] || phases="title&world complementary"
          if [ "$EVENT" = push ] && grep -q '\[no game\]' <<< "$COMMIT_MSG"; then phases=""; fi
          # the exact same files already passed the game phases in an earlier push (typically a branch merged into
          # main as it was): build and check, but don't play them again. "[full game]" in the message plays anyway.
          if [ "$EVENT" = push ] && [ -n "$phases" ] && [ -n "$TREE" ] && ! grep -q '\[full game\]' <<< "$COMMIT_MSG"; then
            tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mac.yml/runs?event=push&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "success" and .id != '"$GITHUB_RUN_ID"') | select(.head_commit.message | contains("[no game]") | not) | .head_commit.tree_id' || true)
            # (filtered here, not with &status=success: that filter lagged a run that had passed 7 min earlier)
            if grep -qxF "$TREE" <<< "$tested"; then echo "tree $TREE already passed the game phases"; phases=""; fi
          fi
          echo "phases=$(printf '%s\n' $phases | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: |
            build/libmcmetal.dylib
            build/libglfw.dylib
            build/libglprof-mcmetal.dylib
            build/gl_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            smoke*.txt
            smoke*-mgl.log
            msl/

  # each game phase on its own Mac, side by side
  game:
    needs: build
    if: ${{ needs.build.outputs.phases != '[]' && needs.build.outputs.phases != '' }}
    runs-on: macos-15
    # a hung game must not hold one of our 5 Macs for half an hour: the slowest healthy phase (ab-*) takes ~8 min;
    # segment benches and soak tests (long) keep 30
    timeout-minutes: ${{ (github.event.inputs.segments || github.event.inputs.long == 'true') && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(needs.build.outputs.phases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: build
      - run: chmod +x build/gl_smoke
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Minecraft install
        uses: actions/cache@v4
        with:
          path: ~/mcgame
          key: mc-1.21.1-neoforge-21.1.259-sodium-iris-v1
      - name: Real game on mcmetal (screenshots)
        # inputs reach the script as environment variables, never pasted into the shell text
        env:
          GAME_BENCH: ${{ github.event.inputs.bench }}
          GAME_BENCH_SETTLE: ${{ github.event.inputs.settle || 10 }}
          GAME_LONG: ${{ github.event.inputs.long }}
          GAME_PROFILE: ${{ github.event.inputs.profile }}
          GAME_ENV: ${{ github.event.inputs.env }}
          GAME_LOOK: ${{ github.event.inputs.look }}
          GAME_AB_OFF: ${{ github.event.inputs.ab_off }}
          GAME_SEGMENTS: ${{ github.event.inputs.segments }}
          GAME_JVM: ${{ github.event.inputs.jvm }}
          PHASE: ${{ matrix.phase }}
        run: |
          IFS='&' read -ra P <<< "$PHASE"  # "title&world": both phases, one after the other, on this Mac
          bash tests/game/ci_game.sh ~/mcgame game-out "${P[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-${{ matrix.phase }}
          # the GLSL dumps hold Complementary's and Sodium's shader source: keep them off this public repo
          path: |
            game-out/
            !game-out/**/glsl/**
