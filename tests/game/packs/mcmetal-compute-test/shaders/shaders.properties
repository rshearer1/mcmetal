iris.features.required = ssbo custom_images compute_shaders
# half-size custom images, written by deferred.csh: the traced picture and the guides MetalFX's denoiser needs
image.halfColor = halfColorSampler RGBA RGBA16F HALF_FLOAT true true 0.5 0.5
image.halfDepth = halfDepthSampler RED R32F FLOAT true true 0.5 0.5
image.halfNormal = halfNormalSampler RGBA RGBA16F HALF_FLOAT true true 0.5 0.5
image.halfAlbedo = halfAlbedoSampler RGBA RGBA16F HALF_FLOAT true true 0.5 0.5
image.halfRough = halfRoughSampler RED R16F HALF_FLOAT true true 0.5 0.5
# storage buffer 0: two uint counters (ground pixels, shadowed pixels)
bufferObject.0 = 16
# deferred.fsh switched off (this pack has none anyway): does deferred.csh still run?
program.deferred.enabled = false
