# mcmetal RT pack: Iris settings
separateAo=true
oldLighting=false
oldHandLight=false
sun=false
moon=true
vignette=false
underwaterOverlay=false
particles.ordering=mixed

# hardware ray tracing replaces the shadow map (RT_MODE: 1 = when mcmetal provides it, 2 = always)
#if RT_MODE == 2 || (RT_MODE == 1 && defined MCMETAL_RT)
shadow.enabled=false
#endif

# GI and AO at half resolution (deferred.fsh's pixels then fill the lower-left quarter of colortex3/4)
#if GI_HALF_RES == 1
scale.deferred=0.5
#endif

# light shafts at half resolution (composite.fsh reads them back at texcoord * 0.5)
scale.deferred3=0.5

# our clouds replace the vanilla ones
#ifdef CLOUDS
clouds=off
#endif

# presets per Mac. Every Apple Silicon Mac can trace rays, but only M3 and newer have ray-tracing hardware: on M1/M2
# rays run on the shader cores, so Low leaves out the costliest (GI, light shafts) and keeps shadows, AO, reflections.
profile.LOW=!RT_GI GI_HALF_RES=1 LIGHT_SLOTS=2 !LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=4 RT_REFLECT_DISTANCE=32.0 RT_GI_DISTANCE=16.0 RT_AO_FRAMES=32.0
profile.MEDIUM=RT_GI GI_HALF_RES=1 LIGHT_SLOTS=4 LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=6 RT_REFLECT_DISTANCE=128.0 RT_GI_DISTANCE=32.0 RT_AO_FRAMES=24.0
profile.HIGH=RT_GI GI_HALF_RES=1 LIGHT_SLOTS=8 LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=8 RT_REFLECT_DISTANCE=256.0 RT_GI_DISTANCE=32.0 RT_AO_FRAMES=24.0
profile.ULTRA=RT_GI GI_HALF_RES=1 LIGHT_SLOTS=8 LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=12 RT_REFLECT_DISTANCE=256.0 RT_GI_DISTANCE=64.0 RT_AO_FRAMES=32.0

screen=<profile> RT_MODE [RAYS] [LIGHT] [COLOUR] [WORLD]
screen.RAYS=RT_GI GI_FILTER SHADOW_CHECKERBOARD RT_AO RT_GI_DISTANCE RT_AO_RADIUS RT_AO_FRAMES SUN_SOFTNESS COLORED_SHADOWS RT_REFLECTIONS RT_REFLECT_DISTANCE WAVE_HEIGHT WAVE_SPEED DEBUG_VIEW
screen.LIGHT=SUN_STRENGTH SKY_LIGHT_STRENGTH BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH SKY_GI_SATURATION COLORED_LIGHT COLORED_LIGHT_STRENGTH LIGHT_SLOTS BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B
screen.COLOUR=TAA LABPBR EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST
screen.WORLD=GI_HALF_RES LIGHT_SHAFTS LIGHT_SHAFTS_STRENGTH LIGHT_SHAFTS_STEPS RAIN_PUDDLES PUDDLE_AMOUNT GLASS_REFRACTION GLASS_REFRACTION_STRENGTH CAUSTICS CAUSTICS_STRENGTH CLOUDS CLOUD_AMOUNT CLOUD_SPEED FOG_DENSITY sunPathRotation WATER_SHADOWS <empty> shadowMapResolution shadowDistance
sliders=GLASS_REFRACTION_STRENGTH CAUSTICS_STRENGTH CLOUD_AMOUNT CLOUD_SPEED PUDDLE_AMOUNT LIGHT_SHAFTS_STRENGTH LIGHT_SHAFTS_STEPS LIGHT_SLOTS COLORED_LIGHT_STRENGTH EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST SUN_STRENGTH SKY_LIGHT_STRENGTH SKY_GI_SATURATION BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B FOG_DENSITY sunPathRotation shadowMapResolution shadowDistance RT_GI_DISTANCE RT_AO_RADIUS RT_AO_FRAMES SUN_SOFTNESS RT_REFLECT_DISTANCE WAVE_HEIGHT WAVE_SPEED

# see-through blocks (lib/gbuffer.glsl, WATER): colortex0 is multiplied by the light let through, colortex13 adds the
# surface's own light, and the mask (colortex11) is replaced by the nearest see-through surface
blend.gbuffers_water.colortex0=ZERO SRC_COLOR ZERO ONE
blend.gbuffers_water.colortex13=ONE ONE ONE ONE
blend.gbuffers_water.colortex11=off
