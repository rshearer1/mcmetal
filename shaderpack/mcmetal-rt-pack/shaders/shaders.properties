# mcmetal RT pack: Iris settings
separateAo=true
oldLighting=false
oldHandLight=false
sun=false
moon=true
vignette=false
underwaterOverlay=false
particles.ordering=mixed

# hardware ray tracing replaces the shadow map (RT_MODE: 1 = when mcmetal provides it, 2 = always)
#if RT_MODE == 2 || (RT_MODE == 1 && defined MCMETAL_RT)
shadow.enabled=false
#endif

screen=RT_MODE <empty> [LIGHT] [COLOUR] [WORLD]
screen.LIGHT=SUN_STRENGTH SKY_LIGHT_STRENGTH BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH <empty> <empty> BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B
screen.COLOUR=EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST
screen.WORLD=FOG_DENSITY sunPathRotation WATER_SHADOWS <empty> shadowMapResolution shadowDistance
sliders=EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST SUN_STRENGTH SKY_LIGHT_STRENGTH BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B FOG_DENSITY sunPathRotation shadowMapResolution shadowDistance
