# mcmetal RT pack: Iris settings
separateAo=true
oldLighting=false
oldHandLight=false
sun=false
moon=true
vignette=false
underwaterOverlay=false
particles.ordering=mixed

# hardware ray tracing replaces the shadow map (RT_MODE: 1 = when mcmetal provides it, 2 = always)
#if RT_MODE == 2 || (RT_MODE == 1 && defined MCMETAL_RT)
shadow.enabled=false
#endif

# the sky table (prepare.fsh, lib/sky.glsl): a fixed 128x64, whatever the window size
size.buffer.colortex12=128 64
# the exposure (composite3.fsh) is one number: a 1x1 buffer, so its pass runs one pixel instead of the whole screen
size.buffer.colortex6=1 1

# GI and AO at half resolution (deferred.fsh's pixels then fill the lower-left quarter of colortex3/4)
#if GI_HALF_RES == 1
scale.deferred=0.5
scale.deferred2=0.5
scale.deferred3=0.5
#endif

# open water's reflections at half resolution (composite1.fsh adds them, read back at texcoord * 0.5)
scale.composite=0.5

# one denoise pass instead of two: deferred2 writes the lighting's buffer itself, so deferred3 is not needed
#if DENOISE_PASSES == 1
program.deferred3.enabled=false
#endif

# What mcmetal's denoised upscaler (MetalFX) should read, if it is switched on. Buffer names, not a switch: the
# pack decides where each input lives. Normals are octahedral in a signed buffer, so no encoding has to be guessed;
# roughness is 1 - smoothness, taken from the named channel.
mcmetal.denoise.color=colortex0
mcmetal.denoise.depth=depthtex0
mcmetal.denoise.normal=colortex1
mcmetal.denoise.albedo=colortex0
mcmetal.denoise.roughness=colortex10
mcmetal.denoise.roughness.channel=b
mcmetal.denoise.specular=colortex10
mcmetal.denoise.transparency=colortex13

# light shafts at half resolution (composite1.fsh reads them back at texcoord * 0.5)
scale.deferred5=0.5

# our clouds replace the vanilla ones
#ifdef CLOUDS
clouds=off
#endif

# presets per Mac. Every Apple Silicon Mac can trace rays, but only M3 and newer have ray-tracing hardware: on M1/M2
# rays run on the shader cores, so Low leaves out the costliest (GI, light shafts) and keeps shadows, AO, reflections.
profile.LOW=!RT_GI GI_RATE=4 GI_HALF_RES=1 LIGHT_SLOTS=2 !LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=4 RT_REFLECT_DISTANCE=32.0 RT_GI_DISTANCE=16.0 RT_AO_FRAMES=32.0
profile.SMOOTH=RT_GI GI_RATE=4 GI_HALF_RES=1 LIGHT_SLOTS=2 LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=4 RT_REFLECT_DISTANCE=64.0 RT_GI_DISTANCE=16.0 RT_AO_FRAMES=32.0
profile.MEDIUM=RT_GI GI_RATE=2 GI_HALF_RES=1 LIGHT_SLOTS=4 LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=6 RT_REFLECT_DISTANCE=128.0 RT_GI_DISTANCE=32.0 RT_AO_FRAMES=24.0
profile.HIGH=RT_GI GI_RATE=2 GI_HALF_RES=1 LIGHT_SLOTS=8 LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=8 RT_REFLECT_DISTANCE=128.0 RT_GI_DISTANCE=32.0 RT_AO_FRAMES=24.0
profile.ULTRA=RT_GI GI_RATE=1 GI_HALF_RES=1 LIGHT_SLOTS=8 LIGHT_SHAFTS LIGHT_SHAFTS_STEPS=12 RT_REFLECT_DISTANCE=256.0 RT_GI_DISTANCE=64.0 RT_AO_FRAMES=32.0

screen=<profile> STYLE RT_MODE [RAYS] [LIGHT] [COLOUR] [WORLD] [SEASON_PAGE]
screen.SEASON_PAGE=SEASONS SEASON_LENGTH SEASON_OFFSET
screen.RAYS=RT_GI GI_COARSE_RAYS LIGHT_CACHE DENOISER DENOISE_PASSES RT_NOISE UNIFIED_TARGETS PHOTO_MODE PHOTO_FRAMES SHADOW_FILTER GI_FILTER GI_RATE GI_ADAPTIVE SHADOW_CHECKERBOARD SHADOW_RATE RT_AO RT_GI_DISTANCE GI_SHORT_RAYS GI_SHORT_DISTANCE RT_AO_RADIUS RT_AO_FRAMES SUN_SOFTNESS COLORED_SHADOWS RT_REFLECTIONS RT_REFLECT_DISTANCE WATER_REFLECT_HALF WAVE_HEIGHT WAVE_SPEED DEBUG_VIEW
screen.LIGHT=SUBSURFACE SUBSURFACE_STRENGTH LIGHTNING_FLASH LIGHTNING_STRENGTH SUN_STRENGTH SKY_LIGHT_STRENGTH BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH SKY_GI_SATURATION COLORED_LIGHT COLORED_LIGHT_GLASS SHARP_LIGHT_SHADOWS COLORED_LIGHT_STRENGTH LIGHT_SLOTS BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B
screen.COLOUR=STYLE TONEMAP TAA SHARPEN SHARPEN_STRENGTH PURKINJE PURKINJE_STRENGTH BLOOM BLOOM_STRENGTH LENS_FLARE LENS_FLARE_STRENGTH DEPTH_OF_FIELD DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH LABPBR LABPBR_NORMAL_STRENGTH PARALLAX PARALLAX_DEPTH PARALLAX_STEPS RT_PBR_EMISSIVE AUTO_PBR AUTO_PBR_STRENGTH ROUGH_REFLECTIONS_STRENGTH EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST
screen.WORLD=GI_HALF_RES WAVING_PLANTS WAVING_AMOUNT WAVING_SPEED LIGHT_SHAFTS LIGHT_SHAFTS_STRENGTH LIGHT_SHAFTS_STEPS LIGHT_SHAFTS_RATE LAMP_FOG LAMP_FOG_STRENGTH VOLUMETRIC_MIST MIST_AMOUNT RAIN_PUDDLES PUDDLE_AMOUNT RAIN_RIPPLES WET_SHEEN GLASS_REFRACTION GLASS_REFRACTION_STRENGTH CAUSTICS CAUSTICS_STRENGTH WATER_DEPTH_COLOR WATER_DEPTH_COLOR_STRENGTH WATER_FOAM CLOUDS CLOUD_AMOUNT CLOUD_SPEED VOLUMETRIC_CLOUDS STARS MILKY_WAY STARS_BRIGHTNESS END_BEAMS END_BEAMS_STRENGTH RAINBOW RAINBOW_STRENGTH LIGHT_POLLUTION LIGHT_POLLUTION_STRENGTH CIRRUS DAILY_WEATHER CLOUD_STEPS CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH FOG_DENSITY sunPathRotation WATER_SHADOWS <empty> shadowMapResolution shadowDistance
sliders=GI_SHORT_DISTANCE PARALLAX_DEPTH PARALLAX_STEPS PHOTO_FRAMES END_BEAMS_STRENGTH LIGHT_POLLUTION_STRENGTH RAINBOW_STRENGTH STARS_BRIGHTNESS SHARPEN_STRENGTH PURKINJE_STRENGTH LAMP_FOG_STRENGTH AUTO_PBR_STRENGTH WAVING_AMOUNT WAVING_SPEED SUBSURFACE_STRENGTH LIGHTNING_STRENGTH LENS_FLARE_STRENGTH DOF_STRENGTH MOTION_BLUR_STRENGTH CLOUD_SHADOW_STRENGTH WATER_DEPTH_COLOR_STRENGTH ROUGH_REFLECTIONS_STRENGTH CLOUD_STEPS MIST_AMOUNT BLOOM_STRENGTH LIGHT_SHAFTS_RATE SEASON_LENGTH SEASON_OFFSET GI_RATE SHADOW_RATE LABPBR_NORMAL_STRENGTH GLASS_REFRACTION_STRENGTH CAUSTICS_STRENGTH CLOUD_AMOUNT CLOUD_SPEED PUDDLE_AMOUNT LIGHT_SHAFTS_STRENGTH LIGHT_SHAFTS_STEPS LIGHT_SLOTS COLORED_LIGHT_STRENGTH EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST SUN_STRENGTH SKY_LIGHT_STRENGTH SKY_GI_SATURATION BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B FOG_DENSITY sunPathRotation shadowMapResolution shadowDistance RT_GI_DISTANCE RT_AO_RADIUS RT_AO_FRAMES SUN_SOFTNESS RT_REFLECT_DISTANCE WAVE_HEIGHT WAVE_SPEED

# see-through blocks (lib/gbuffer.glsl, WATER): colortex0 is multiplied by the light let through, colortex13 adds the
# surface's own light, and the mask (colortex11) is replaced by the nearest see-through surface
blend.gbuffers_water.colortex0=ZERO SRC_COLOR ZERO ONE
blend.gbuffers_water.colortex13=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex11=off

# UNIFIED_TARGETS: the other see-through programs also list colortex0,11,13 (one render pass with water); they keep
# what is in 11 and 13
#ifdef UNIFIED_TARGETS
blend.gbuffers_armor_glint.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_armor_glint.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_beaconbeam.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_beaconbeam.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_block_translucent.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_block_translucent.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_entities_translucent.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_entities_translucent.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_hand_water.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_hand_water.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_lightning.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_lightning.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_particles_translucent.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_particles_translucent.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_spidereyes.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_spidereyes.colortex13=ZERO ONE ZERO ONE
blend.gbuffers_weather.colortex11=ZERO ONE ZERO ONE
blend.gbuffers_weather.colortex13=ZERO ONE ZERO ONE
#endif
