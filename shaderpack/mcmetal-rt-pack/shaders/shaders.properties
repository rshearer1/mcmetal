# mcmetal RT pack: Iris settings
separateAo=true
oldLighting=false
oldHandLight=false
sun=false
moon=true
vignette=false
underwaterOverlay=false
particles.ordering=mixed

# hardware ray tracing replaces the shadow map (RT_MODE: 1 = when mcmetal provides it, 2 = always)
#if RT_MODE == 2 || (RT_MODE == 1 && defined MCMETAL_RT)
shadow.enabled=false
#endif

# GI and AO at half resolution (deferred.fsh's pixels then fill the lower-left quarter of colortex3/4)
#if GI_HALF_RES == 1
scale.deferred=0.5
#endif

# light shafts at half resolution (composite.fsh reads them back at texcoord * 0.5)
scale.deferred3=0.5

# our clouds replace the vanilla ones
#ifdef CLOUDS
clouds=off
#endif

screen=RT_MODE <empty> [LIGHT] [COLOUR] [WORLD]
screen.LIGHT=SUN_STRENGTH SKY_LIGHT_STRENGTH BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH SKY_GI_SATURATION COLORED_LIGHT COLORED_LIGHT_STRENGTH LIGHT_SLOTS BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B
screen.COLOUR=EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST
screen.WORLD=GI_HALF_RES LIGHT_SHAFTS LIGHT_SHAFTS_STRENGTH LIGHT_SHAFTS_STEPS RAIN_PUDDLES PUDDLE_AMOUNT CLOUDS CLOUD_AMOUNT CLOUD_SPEED FOG_DENSITY sunPathRotation WATER_SHADOWS <empty> shadowMapResolution shadowDistance
sliders=CLOUD_AMOUNT CLOUD_SPEED PUDDLE_AMOUNT LIGHT_SHAFTS_STRENGTH LIGHT_SHAFTS_STEPS LIGHT_SLOTS COLORED_LIGHT_STRENGTH EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST SUN_STRENGTH SKY_LIGHT_STRENGTH SKY_GI_SATURATION BLOCK_LIGHT_STRENGTH EMISSIVE_STRENGTH BLOCK_LIGHT_R BLOCK_LIGHT_G BLOCK_LIGHT_B FOG_DENSITY sunPathRotation shadowMapResolution shadowDistance
